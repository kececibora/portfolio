    <style>.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}.muted{fill:#8B95A7}.faint{fill:#687486}.cyan{fill:#3FE0FF}.violet{fill:#8A6BFF}</style>
  </defs>
  <path fill="url(#bg)" d="M0 0h1200v630H0z"/><path fill="url(#glow-c)" d="M0 0h1200v630H0z"/><path fill="url(#glow-v)" d="M0 0h1200v630H0z"/><path fill="url(#grid)" d="M0 0h1200v630H0z"/>
