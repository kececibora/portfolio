<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ramazan Bora Keçeci — Flutter, ERP and IoT developer</title>
  <desc id="desc">A dark blueprint-style social card with a geometric BK monogram and a field-to-software pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="0" x2="1130" y2="630" gradientUnits="userSpaceOnUse"><stop stop-color="#111822"/><stop offset=".52" stop-color="#0A0C10"/><stop offset="1" stop-color="#15101F"/></linearGradient>
    <linearGradient id="accent" x1="84" y1="66" x2="1120" y2="566" gradientUnits="userSpaceOnUse"><stop stop-color="#3FE0FF"/><stop offset="1" stop-color="#8A6BFF"/></linearGradient>
    <radialGradient id="glow-c" cx="0" cy="0" r="1" gradientTransform="translate(210 160) rotate(40) scale(440 330)" gradientUnits="userSpaceOnUse"><stop stop-color="#3FE0FF" stop-opacity=".13"/><stop offset="1" stop-color="#3FE0FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-v" cx="0" cy="0" r="1" gradientTransform="translate(1010 540) rotate(-130) scale(420 340)" gradientUnits="userSpaceOnUse"><stop stop-color="#8A6BFF" stop-opacity=".14"/><stop offset="1" stop-color="#8A6BFF" stop-opacity="0"/></radialGradient>
