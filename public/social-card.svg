      <path fill="#3FE0FF" fill-opacity=".08" d="M264 0h126v54H264z"/><path fill="none" stroke="#3FE0FF" stroke-width="2" d="M281 39h24V15h-24zm5 7h14"/><text x="315" y="32" class="cyan">DEVICE</text>
    </g>
