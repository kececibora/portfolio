  <g transform="translate(72 548)">
    <text class="mono faint" font-size="11" letter-spacing="2">ANKARA, TÜRKİYE</text><text x="1056" class="mono cyan" font-size="11" font-weight="600" letter-spacing="2" text-anchor="end">RBKECECI.COM</text>
