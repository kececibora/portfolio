    <text y="68" class="sans" fill="#E7ECF3" font-size="58" font-weight="740" letter-spacing="-1.6">Keçeci</text>
    <text y="126" class="mono cyan" font-size="18" font-weight="600" letter-spacing="4">FLUTTER / ERP / IoT</text>
    <text y="171" class="sans muted" font-size="17">Mobile products, business automation</text>
    <text y="197" class="sans muted" font-size="17">and connected-device prototypes.</text>
  </g>

