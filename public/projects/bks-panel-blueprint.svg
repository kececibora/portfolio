      <stop offset=".52" stop-color="#0A0C10"/>
      <stop offset="1" stop-color="#11101B"/>
    </linearGradient>
    <linearGradient id="accent" x1="86" y1="180" x2="636" y2="1260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3FE0FF"/>
      <stop offset="1" stop-color="#8A6BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(536 320) rotate(118) scale(470 380)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3FE0FF" stop-opacity=".15"/>
      <stop offset="1" stop-color="#3FE0FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
