<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1440" role="img" aria-labelledby="title desc">
  <title id="title">Dealer operations panel blueprint</title>
  <desc id="desc">A fictional dark interface showing inventory, quotes, orders, and ERP synchronization without real company or customer data.</desc>
  <defs>
