<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Embedded systems concept lab</title>
  <desc id="desc">A representative, non-pinout system map connecting generic sensors, a microcontroller prototype, wireless links, and actuators.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="720" gradientUnits="userSpaceOnUse"><stop stop-color="#101620"/><stop offset=".5" stop-color="#0A0C10"/><stop offset="1" stop-color="#12101B"/></linearGradient>
    <linearGradient id="accent" x1="300" y1="80" x2="1300" y2="650" gradientUnits="userSpaceOnUse"><stop stop-color="#3FE0FF"/><stop offset="1" stop-color="#8A6BFF"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(800 382) rotate(90) scale(340 620)" gradientUnits="userSpaceOnUse"><stop stop-color="#3FE0FF" stop-opacity=".16"/><stop offset=".65" stop-color="#8A6BFF" stop-opacity=".05"/><stop offset="1" stop-color="#3FE0FF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0v48" fill="none" stroke="#3FE0FF" stroke-opacity=".055"/><path d="M12 0v48M24 0v48M36 0v48M0 12h48M0 24h48M0 36h48" fill="none" stroke="#3FE0FF" stroke-opacity=".018"/></pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000" flood-opacity=".65"/></filter>
    <marker id="arrow-c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path fill="#3FE0FF" d="M0 0v8l8-4Z"/></marker>
    <marker id="arrow-v" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path fill="#8A6BFF" d="M0 0v8l8-4Z"/></marker>
    <style>.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}.muted{fill:#8B95A7}.faint{fill:#687486}.cyan{fill:#3FE0FF}.violet{fill:#8A6BFF}</style>
  </defs>
  <path fill="url(#bg)" d="M0 0h1600v720H0z"/><path fill="url(#glow)" d="M0 0h1600v720H0z"/><path fill="url(#grid)" d="M0 0h1600v720H0z"/>
  <path fill="none" stroke="#3FE0FF" stroke-opacity=".24" d="M30 82V30h52M1518 30h52v52M30 638v52h52M1518 690h52v-52"/>

