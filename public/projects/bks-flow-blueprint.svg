      <path fill="#8A6BFF" fill-opacity=".08" stroke="#8A6BFF" stroke-opacity=".34" d="M484 0h58a12 12 0 0 1 12 12v40a12 12 0 0 1-12 12h-58a12 12 0 0 1-12-12V12a12 12 0 0 1 12-12Z"/><text x="497" y="37" class="violet">LEARN</text>
