<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1440" role="img" aria-labelledby="title desc">
  <title id="title">Workflow process engine blueprint</title>
  <desc id="desc">A fictional dark workflow interface with form, review, approval, and reporting nodes and no real employee or company data.</desc>
  <defs>
