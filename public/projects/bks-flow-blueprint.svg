    <linearGradient id="accent" x1="110" y1="200" x2="610" y2="1230" gradientUnits="userSpaceOnUse"><stop stop-color="#3FE0FF"/><stop offset="1" stop-color="#8A6BFF"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(180 500) rotate(52) scale(520 420)" gradientUnits="userSpaceOnUse"><stop stop-color="#8A6BFF" stop-opacity=".14"/><stop offset="1" stop-color="#8A6BFF" stop-opacity="0"/></radialGradient>
